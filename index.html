<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>QSO Logger</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="page-container">
      <header>
        <p class="terminal-label">VE3RER // QSO SYSTEM</p>
        <h1>QSO Logger</h1>
        <p>Amateur radio contact logging and mapping</p>
      </header>

      <main class="dashboard">
        <section class="qso-panel">
          <h2>Add QSO</h2>

          <form id="qso-form">
            <div class="form-group">
              <label for="callsign">Callsign</label>
              <input
                type="text"
                id="callsign"
                name="callsign"
                placeholder="VE3ABC"
                required
              />
            </div>

            <div class="form-group">
              <label for="grid">Grid locator</label>
              <input
                type="text"
                id="grid"
                name="grid"
                placeholder="FN03"
                required
              />
            </div>

            <div class="form-group">
              <label for="frequency">Frequency (MHz)</label>
              <input
                type="number"
                id="frequency"
                name="frequency"
                placeholder="14.200"
                step="0.001"
                min="0"
              />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="band">Band</label>
                <select id="band" name="band">
                  <option value="" selected>Auto</option>
                  <option value="2200m">2200 m</option>
                  <option value="630m">630 m</option>
                  <option value="160m">160 m</option>
                  <option value="80m">80 m</option>
                  <option value="60m">60 m</option>
                  <option value="40m">40 m</option>
                  <option value="30m">30 m</option>
                  <option value="20m">20 m</option>
                  <option value="17m">17 m</option>
                  <option value="15m">15 m</option>
                  <option value="12m">12 m</option>
                  <option value="10m">10 m</option>
                  <option value="6m">6 m</option>
                  <option value="2m">2 m</option>
                  <option value="70cm">70 cm</option>
                  <option value="33cm">33 cm</option>
                  <option value="23cm">23 cm</option>
                  <option value="13cm">13 cm</option>
                </select>
              </div>

              <div class="form-group">
                <label for="mode">Mode</label>
                <select id="mode" name="mode">
                  <option value="SSB">SSB</option>
                  <option value="USB">USB</option>
                  <option value="LSB">LSB</option>
                  <option value="CW">CW</option>
                  <option value="FM">FM</option>
                  <option value="AM">AM</option>
                  <option value="FT8">FT8</option>
                  <option value="FT4">FT4</option>
                  <option value="RTTY">RTTY</option>
                  <option value="PSK31">PSK31</option>
                  <option value="JS8">JS8Call</option>
                  <option value="SSTV">SSTV</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="rst">RST</label>
              <input type="text" id="rst" name="rst" placeholder="59" />
            </div>

            <div class="form-group">
              <label for="notes">Notes</label>
              <textarea
                id="notes"
                name="notes"
                rows="4"
                placeholder="Optional notes..."
              ></textarea>
            </div>

            <button type="submit">Add QSO</button>
          </form>
        </section>

        <section class="map-panel">
          <div id="map"></div>
        </section>
      </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
